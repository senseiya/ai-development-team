services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-team-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_team}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_team_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ai_development_team}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_team}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-team-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: ai-team-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ai_team}:${POSTGRES_PASSWORD:-ai_team_secret}@postgres:5432/${POSTGRES_DB:-ai_development_team}
      REDIS_URL: redis://redis:6379/0
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-4-26b-a4b-it:free}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-openrouter}
      API_KEY_STATIC: ${API_KEY_STATIC:-change-me-in-production}
      ENVIRONMENT: development
      AUTO_MIGRATE: "true"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data: