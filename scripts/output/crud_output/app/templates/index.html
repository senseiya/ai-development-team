<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster Pro | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .task-card:hover { transform: translateY(-2px); transition: all 0.2s ease; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-indigo-600 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <i class="fas fa-check-double text-2xl mr-2"></i>
                    <span class="text-xl font-bold tracking-tight">TaskMaster Pro</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-indigo-100 text-sm hidden sm:inline">Manage your productivity</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Task Creation Form -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 sticky top-8">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">Create New Task</h2>
                    <form id="taskForm" class="space-y-4">
                        <input type="hidden" id="taskId" name="id">
                        <div>
                            <label for="title" class="block text-sm font-medium text-gray-700">Task Title</label>
                            <input type="text" id="title" name="title" required
                                class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400
                                focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                                placeholder="e.g. Finish documentation">
                        </div>
                        <div>
                            <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                            <textarea id="description" name="description" rows="3"
                                class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400
                                focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                                placeholder="Details about the task..."></textarea>
                        </div>
                        <div>
                            <label for="priority" class="block text-sm font-medium text-gray-700">Priority</label>
                            <select id="priority" name="priority"
                                class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md text-sm shadow-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                        <div class="pt-2">
                            <button type="submit" id="submitBtn"
                                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                                <i class="fas fa-plus mr-2 mt-1"></i> Add Task
                            </button>
                            <button type="button" id="cancelBtn"
                                class="hidden w-full mt-2 flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none">
                                Cancel Edit
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Task List Container -->
            <div class="lg:col-span-2">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-bold text-gray-900">Your Tasks</h2>
                    <div id="taskStats" class="text-sm text-gray-500">
                        <!-- Stats injected by JS -->
                    </div>
                </div>

                <div id="taskList" class="space-y-4">
                    <!-- Tasks will be injected here by JS -->
                    <div class="flex justify-center py-12">
                        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Notifications -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 space-y-2"></div>

    <script>
        /**
         * TaskMaster Pro - Frontend Logic
         * Handles CRUD operations via REST API
         */
        
        const API_BASE = ""; // Relative to root
        const taskForm = document.getElementById("taskForm");
        const taskList = document.getElementById("taskList");
        const submitBtn = document.getElementById("submitBtn");
        const cancelBtn = document.getElementById("cancelBtn");
        const taskIdInput = document.getElementById("taskId");
        const toastContainer = document.getElementById("toastContainer");

        let isEditing = false;

        // Initialize Application
        document.addEventListener("DOMContentLoaded", fetchTasks);

        // Form Submission Handler
        taskForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const formData = new FormData(taskForm);
            const data = Object.fromEntries(formData.entries());

            try {
                if (isEditing) {
                    const id = taskIdInput.value;
                    const response = await fetch(`${API_BASE}/tasks/${id}`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(data)
                    });
                    if (!response.ok) throw new Error("Failed to update task");
                    showToast("Task updated successfully!", "success");
                } else {
                    const response = await fetch(`${API_BASE}/tasks`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(data)
                    });
                    if (!response.ok) throw new Error("Failed to create task");
                    showToast("Task created successfully!", "success");
                }
                resetForm();
                fetchTasks();
            } catch (err) {
                showToast(err.message, "error");
            }
        });

        // Fetch and Render Tasks
        async function fetchTasks() {
            try {
                const response = await fetch(`${API_BASE}/tasks`);
                if (!response.ok) throw new Error("Failed to fetch tasks");
                const tasks = await response.json();
                renderTasks(tasks);
                updateStats(tasks);
            } catch (err) {
                taskList.innerHTML = `<div class="text-red-500 p-4 bg-red-50 rounded-lg text-center">${err.message}</div>`;
            }
        }

        function renderTasks(tasks) {
            if (tasks.length === 0) {
                taskList.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-xl border-2 border-dashed border-gray-300">
                        <i class="fas fa-clipboard-list text-4xl text-gray-300 mb-3"></i>
                        <p class="text-gray-500">No tasks found. Start by creating one!</p>
                    </div>`;
                return;
            }

            taskList.innerHTML = tasks.map(task => `
                <div class="task-card bg-white rounded-xl shadow-sm border border-gray-200 p-5 flex items-start justify-between group">
                    <div class="flex items-start space-x-4">
                        <input type="checkbox" 
                            ${task.completed ? 'checked' : ''} 
                            onclick="toggleTask(${task.id}, ${task.completed})"
                            class="mt-1.5 h-5 w-5 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500 cursor-pointer">
                        <div>
                            <h3 class="text-lg font-semibold ${task.completed ? 'line-through text-gray-400' : 'text-gray-900'}">
                                ${escapeHtml(task.title)}
                            </h3>
                            <p class="text-gray-600 text-sm mt-1">${escapeHtml(task.description || '')}</p>
                            <div class="flex items-center mt-3 space-x-3">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium 
                                    ${getPriorityClass(task.priority)}">
                                    ${task.priority.toUpperCase()}
                                </span>
                                <span class="text-xs text-gray-400">
                                    <i class="far fa-clock mr-1"></i> ${formatDate(task.created_at)}
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="editTask(${JSON.stringify(task).replace(/"/g, '&quot;')})" 
                            class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" title="Edit">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="deleteTask(${task.id})" 
                            class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Delete">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Task Actions
        async function toggleTask(id, currentStatus) {
            try {
                const response = await fetch(`${API_BASE}/tasks/${id}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ completed: !currentStatus })
                });
                if (!response.ok) throw new Error("Failed to update task status");
                fetchTasks();
            } catch (err) {
                showToast(err.message, "error");
                fetchTasks(); // Revert UI
            }
        }

        async function deleteTask(id) {
            if (!confirm("Are you sure you want to delete this task?")) return;
            try {
                const response = await fetch(`${API_BASE}/tasks/${id}`, { method: "DELETE" });
                if (!response.ok) throw new Error("Failed to delete task");
                showToast("Task deleted", "success");
                fetchTasks();
            } catch (err) {
                showToast(err.message, "error");
            }
        }

        function editTask(task) {
            isEditing = true;
            taskIdInput.value = task.id;
            document.getElementById("title").value = task.title;
            document.getElementById("description").value = task.description;
            document.getElementById("priority").value = task.priority;
            
            submitBtn.innerHTML = '<i class="fas fa-save mr-2 mt-1"></i> Update Task';
            submitBtn.classList.replace("bg-indigo-600", "bg-blue-600");
            cancelBtn.classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        cancelBtn.addEventListener("click", resetForm);

        function resetForm() {
            isEditing = false;
            taskForm.reset();
            taskIdInput.value = "";
            submitBtn.innerHTML = '<i class="fas fa-plus mr-2 mt-1"></i> Add Task';
            submitBtn.classList.replace("bg-blue-600", "bg-indigo-600");
            cancelBtn.classList.add("hidden");
        }

        // Helpers
        function getPriorityClass(priority) {
            switch (priority.toLowerCase()) {
                case 'high': return 'bg-red-100 text-red-800';
                case 'medium': return 'bg-yellow-100 text-yellow-800';
                case 'low': return 'bg-green-100 text-green-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateStats(tasks) {
            const completed = tasks.filter(t => t.completed).length;
            const total = tasks.length;
            document.getElementById("taskStats").innerHTML = `
                <span class="font-medium">${completed}/${total} completed</span>
            `;
        }

        function showToast(message, type = "info") {
            const toast = document.createElement("div");
            const colors = {
                success: "bg-green-600",
                error: "bg-red-600",
                info: "bg-blue-600"
            };
            toast.className = `${colors[type]} text-white px-6 py-3 rounded-lg shadow-xl text-sm font-medium transform transition-all duration-300 translate-y-10 opacity-0`;
            toast.textContent = message;
            toastContainer.appendChild(toast);

            // Trigger animation
            setTimeout(() => {
                toast.classList.remove("translate-y-10", "opacity-0");
            }, 10);

            // Remove after delay
            setTimeout(() => {
                toast.classList.add("opacity-0");
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
